name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

jobs:
  # ==============================================================================
  # CONTINUOUS INTEGRATION - Basic Checks
  # ==============================================================================
  ci:
    name: 🔍 CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_backend.txt
          echo "✅ Dependencies installed"

      - name: 🔍 Lint Code
        run: |
          echo "🔍 Checking required files..."
          test -f "app.py" && echo "✅ app.py found" || exit 1
          test -f "requirements_backend.txt" && echo "✅ requirements_backend.txt found" || exit 1
          test -f "Dockerfile" && echo "✅ Dockerfile found" || exit 1
          test -f "streamlit_app.py" && echo "✅ streamlit_app.py found" || exit 1
          echo "✅ All required files present"

      - name: 🐳 Validate Dockerfile
        run: |
          echo "🔍 Validating Dockerfile syntax..."
          docker build --check . 2>/dev/null || docker build -f Dockerfile --no-cache --progress=plain . -t test-build 2>&1 | head -50
          echo "✅ Dockerfile validation complete"
        continue-on-error: true

      - name: 🧪 Syntax Check
        run: |
          echo "🔍 Checking Python syntax..."
          python -m py_compile app.py
          python -m py_compile streamlit_app.py
          echo "✅ Python syntax valid"

      - name: 📋 Summary
        run: |
          echo "=============================================="
          echo "✅ CI Pipeline Completed Successfully!"
          echo "=============================================="
          echo ""
          echo "📦 Deployment Notes:"
          echo "  - Backend: Auto-deploys to Render.com on push"
          echo "  - Frontend: Auto-deploys to Streamlit Cloud on push"
          echo ""
          echo "🔗 Links:"
          echo "  - Streamlit: https://phisingdection.streamlit.app"
          echo "=============================================="